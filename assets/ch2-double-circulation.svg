<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Double circulation through four heart chambers</title><desc id="desc">Body, vena cava, right atrium, right ventricle, pulmonary artery, lungs, pulmonary vein, left atrium, left ventricle, aorta, body.</desc><defs><marker id="blue" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#3c77ad"/></marker><marker id="red" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#bd5268"/></marker></defs><rect width="1100" height="650" fill="white"/><g font-family="Arial,sans-serif" fill="#17273a" text-anchor="middle"><text x="550" y="36" font-size="26" font-weight="700">Two circuits, one heart</text><rect x="415" y="58" width="270" height="90" rx="24" fill="#ece3f7" stroke="#59627c" stroke-width="3"/><text x="550" y="95" font-size="24" font-weight="700">Lungs</text><text x="550" y="125" font-size="18">O₂ in · CO₂ out</text><rect x="310" y="238" width="215" height="100" rx="22" fill="#e5f2ff" stroke="#3c77ad" stroke-width="3"/><text x="417" y="296" font-size="23" font-weight="700">Right atrium</text><rect x="310" y="380" width="215" height="100" rx="22" fill="#d9ebff" stroke="#3c77ad" stroke-width="3"/><text x="417" y="438" font-size="23" font-weight="700">Right ventricle</text><rect x="575" y="238" width="215" height="100" rx="22" fill="#fff0f2" stroke="#bd5268" stroke-width="3"/><text x="683" y="296" font-size="23" font-weight="700">Left atrium</text><rect x="575" y="380" width="215" height="100" rx="22" fill="#ffe5ea" stroke="#bd5268" stroke-width="6"/><text x="683" y="438" font-size="23" font-weight="700">Left ventricle</text><rect x="415" y="532" width="270" height="86" rx="24" fill="#e7f4ed" stroke="#4e8072" stroke-width="3"/><text x="550" y="567" font-size="24" font-weight="700">Body tissues</text><text x="550" y="596" font-size="18">O₂ used · CO₂ released</text></g><g fill="none" stroke-width="5" stroke-linejoin="round"><path d="M430 575H235V288H300" stroke="#3c77ad" marker-end="url(#blue)"/><path d="M417 338V370" stroke="#3c77ad" marker-end="url(#blue)"/><path d="M310 430H115V103H405" stroke="#3c77ad" marker-end="url(#blue)"/><path d="M685 103H865V288H800" stroke="#bd5268" marker-end="url(#red)"/><path d="M683 338V370" stroke="#bd5268" marker-end="url(#red)"/><path d="M790 430H965V575H695" stroke="#bd5268" marker-end="url(#red)"/></g><g font-family="Arial,sans-serif" font-size="20" fill="#17273a"><rect x="62" y="166" width="175" height="54" rx="8" fill="white"/><text x="80" y="188">Pulmonary artery</text><rect x="768" y="166" width="170" height="54" rx="8" fill="white"/><text x="790" y="188">Pulmonary vein</text><rect x="167" y="499" width="138" height="33" rx="8" fill="white"/><text x="184" y="523">Vena cava</text><rect x="920" y="493" width="88" height="34" rx="8" fill="white"/><text x="941" y="517">Aorta</text><text x="112" y="640" font-size="16" fill="#3c77ad">Blue = lower oxygen</text><text x="750" y="640" font-size="16" fill="#bd5268">Pink = higher oxygen</text></g></svg>