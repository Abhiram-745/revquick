<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590" role="img" aria-labelledby="title desc"><title id="title">Meristems → useful plant clones</title><desc id="desc">Root-tip and shoot-tip meristems contain stem cells. They can form any plant cell type and produce genetically identical plants quickly and economically, helping conserve rare species and propagate useful crop traits.</desc><rect width="1100" height="590" fill="white"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#17273a}.heading{font-size:32px;font-weight:700}.label{font-size:24px;font-weight:700}.note{font-size:21px}.small{font-size:18px;fill:#526477}.arrow{stroke:#227669;stroke-width:3;fill:none}.outline{stroke:#17273a;stroke-width:2.5;fill:none}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#227669"/></marker></defs><text x="35" y="48" class="heading">Meristems → useful plant clones</text><text x="35" y="87" class="note">Meristem cells can differentiate into any plant-cell type throughout life.</text><rect x="35" y="120" width="370" height="350" rx="18" fill="#e7f4ee"/><g transform="translate(200 275) scale(1.35)"><path d="M0 42 V-65" stroke="#227669" stroke-width="5" fill="none"/><path d="M0 -27 Q-48 -66 -45 -26 Q-20 -7 0 -27 M0 -48 Q48 -90 45 -46 Q22 -21 0 -48" fill="#bee2c6" stroke="#227669" stroke-width="2.5"/><path d="M0 42 L-12 73 M0 42 L15 77 M0 42 V87" stroke="#a98a65" stroke-width="3" fill="none"/></g><circle cx="200" cy="187" r="12" fill="#fff2b9" stroke="#17273a" stroke-width="2.5"/><circle cx="200" cy="390" r="12" fill="#fff2b9" stroke="#17273a" stroke-width="2.5"/><text x="45" y="157" class="note">Shoot-tip meristem</text><path d="M245 163 L204 180" stroke="#17273a" stroke-width="2" fill="none"/><text x="45" y="441" class="note">Root-tip meristem</text><path d="M180 420 L196 397" stroke="#17273a" stroke-width="2" fill="none"/><path d="M415 280 L487 280" class="arrow" marker-end="url(#arrow)"/><rect x="500" y="174" width="205" height="203" rx="18" fill="#e6f1ff"/><text x="603" y="215" class="label" text-anchor="middle">Meristem cells</text><circle cx="573" cy="276" r="22" fill="white" stroke="#17273a" stroke-width="2.5"/><circle cx="573" cy="276" r="7" fill="#a581d5" stroke="#a581d5" stroke-width="2.5"/><circle cx="620" cy="272" r="22" fill="white" stroke="#17273a" stroke-width="2.5"/><circle cx="620" cy="272" r="7" fill="#a581d5" stroke="#a581d5" stroke-width="2.5"/><circle cx="598" cy="319" r="22" fill="white" stroke="#17273a" stroke-width="2.5"/><circle cx="598" cy="319" r="7" fill="#a581d5" stroke="#a581d5" stroke-width="2.5"/><path d="M714 280 L777 280" class="arrow" marker-end="url(#arrow)"/><rect x="790" y="120" width="275" height="350" rx="18" fill="#f2eafb"/><text x="928" y="158" class="note" text-anchor="middle">Genetically identical</text><text x="928" y="187" class="label" text-anchor="middle">plants (clones)</text><g transform="translate(841 297) scale(0.68)"><path d="M0 42 V-65" stroke="#227669" stroke-width="5" fill="none"/><path d="M0 -27 Q-48 -66 -45 -26 Q-20 -7 0 -27 M0 -48 Q48 -90 45 -46 Q22 -21 0 -48" fill="#bee2c6" stroke="#227669" stroke-width="2.5"/><path d="M0 42 L-12 73 M0 42 L15 77 M0 42 V87" stroke="#a98a65" stroke-width="3" fill="none"/></g><g transform="translate(926 297) scale(0.68)"><path d="M0 42 V-65" stroke="#227669" stroke-width="5" fill="none"/><path d="M0 -27 Q-48 -66 -45 -26 Q-20 -7 0 -27 M0 -48 Q48 -90 45 -46 Q22 -21 0 -48" fill="#bee2c6" stroke="#227669" stroke-width="2.5"/><path d="M0 42 L-12 73 M0 42 L15 77 M0 42 V87" stroke="#a98a65" stroke-width="3" fill="none"/></g><g transform="translate(1010 297) scale(0.68)"><path d="M0 42 V-65" stroke="#227669" stroke-width="5" fill="none"/><path d="M0 -27 Q-48 -66 -45 -26 Q-20 -7 0 -27 M0 -48 Q48 -90 45 -46 Q22 -21 0 -48" fill="#bee2c6" stroke="#227669" stroke-width="2.5"/><path d="M0 42 L-12 73 M0 42 L15 77 M0 42 V87" stroke="#a98a65" stroke-width="3" fill="none"/></g><text x="928" y="405" class="small" text-anchor="middle">Quickly and economically</text><rect x="35" y="493" width="500" height="62" rx="18" fill="#e6f1ff"/><text x="57" y="532" class="note">Rare species: protect from extinction</text><rect x="555" y="493" width="510" height="62" rx="18" fill="#fff2b9"/><text x="577" y="532" class="note">Crops: retain useful disease resistance</text></svg>