<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590" role="img" aria-labelledby="title desc"><title id="title">Mitosis keeps the chromosome set</title><desc id="desc">A counted model with two original chromosomes. DNA replicates before mitosis; two identical chromosome sets form in two nuclei; cytoplasm and membrane then divide into two cells with two chromosomes each.</desc><rect width="1100" height="590" fill="white"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#17273a}.heading{font-size:32px;font-weight:700}.label{font-size:24px;font-weight:700}.note{font-size:21px}.small{font-size:18px;fill:#526477}.arrow{stroke:#227669;stroke-width:3;fill:none}.outline{stroke:#17273a;stroke-width:2.5;fill:none}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#227669"/></marker></defs><text x="35" y="48" class="heading">Mitosis keeps the chromosome set</text><text x="35" y="87" class="note">Model cell: 2 chromosomes. The colours track each chromosome through the sequence.</text><rect x="35" y="122" width="220" height="342" rx="18" fill="#f8fafb"/><rect x="285" y="122" width="240" height="342" rx="18" fill="#f8fafb"/><rect x="555" y="122" width="250" height="342" rx="18" fill="#f8fafb"/><rect x="835" y="122" width="230" height="342" rx="18" fill="#f8fafb"/><text x="145" y="163" class="label" text-anchor="middle">Starting cell</text><circle cx="145" cy="285" r="57" fill="#e6f1ff" stroke="#17273a" stroke-width="2.5"/><circle cx="145" cy="285" r="39.9" fill="white" stroke="#17273a" stroke-width="2.5"/><path d="M131 264.0 V306.0" stroke="#6b9de3" stroke-width="10" stroke-linecap="round"/><path d="M162 264.0 V306.0" stroke="#a581d5" stroke-width="10" stroke-linecap="round"/><text x="145" y="414" class="note" text-anchor="middle">2 chromosomes</text><text x="405" y="158" class="label" text-anchor="middle">1 · Before mitosis</text><text x="405" y="191" class="note" text-anchor="middle">Grow + copy DNA</text><circle cx="405" cy="285" r="70" fill="#e6f1ff" stroke="#17273a" stroke-width="2.5"/><circle cx="405" cy="285" r="49.0" fill="white" stroke="#17273a" stroke-width="2.5"/><path d="M381 260 L401 310 M401 260 L381 310" stroke="#6b9de3" stroke-width="8" stroke-linecap="round"/><path d="M412 260 L432 310 M432 260 L412 310" stroke="#a581d5" stroke-width="8" stroke-linecap="round"/><text x="405" y="414" class="note" text-anchor="middle">DNA has doubled</text><text x="680" y="158" class="label" text-anchor="middle">2 · Mitosis</text><text x="680" y="191" class="note" text-anchor="middle">Nucleus divides</text><ellipse cx="680" cy="285" rx="104" ry="68" fill="#e6f1ff" stroke="#17273a" stroke-width="2.5"/><circle cx="627" cy="285" r="38" fill="white" stroke="#17273a" stroke-width="2.5"/><path d="M615 268.0 V302.0" stroke="#6b9de3" stroke-width="10" stroke-linecap="round"/><path d="M640 268.0 V302.0" stroke="#a581d5" stroke-width="10" stroke-linecap="round"/><circle cx="733" cy="285" r="38" fill="white" stroke="#17273a" stroke-width="2.5"/><path d="M721 268.0 V302.0" stroke="#6b9de3" stroke-width="10" stroke-linecap="round"/><path d="M746 268.0 V302.0" stroke="#a581d5" stroke-width="10" stroke-linecap="round"/><text x="680" y="400" class="note" text-anchor="middle">An identical set</text><text x="680" y="430" class="note" text-anchor="middle">at each end</text><text x="950" y="158" class="label" text-anchor="middle">3 · Cell divides</text><text x="950" y="191" class="small" text-anchor="middle">Cytoplasm + membrane</text><circle cx="897" cy="285" r="48" fill="#e6f1ff" stroke="#17273a" stroke-width="2.5"/><circle cx="897" cy="285" r="33.599999999999994" fill="white" stroke="#17273a" stroke-width="2.5"/><path d="M883 264.0 V306.0" stroke="#6b9de3" stroke-width="10" stroke-linecap="round"/><path d="M914 264.0 V306.0" stroke="#a581d5" stroke-width="10" stroke-linecap="round"/><circle cx="1009" cy="285" r="48" fill="#e6f1ff" stroke="#17273a" stroke-width="2.5"/><circle cx="1009" cy="285" r="33.599999999999994" fill="white" stroke="#17273a" stroke-width="2.5"/><path d="M995 264.0 V306.0" stroke="#6b9de3" stroke-width="10" stroke-linecap="round"/><path d="M1026 264.0 V306.0" stroke="#a581d5" stroke-width="10" stroke-linecap="round"/><text x="950" y="400" class="note" text-anchor="middle">2 daughter cells</text><text x="950" y="430" class="note" text-anchor="middle">2 chromosomes each</text><path d="M220 285 L277 285" class="arrow" marker-end="url(#arrow)"/><path d="M477 285 L547 285" class="arrow" marker-end="url(#arrow)"/><path d="M790 285 L827 285" class="arrow" marker-end="url(#arrow)"/><rect x="35" y="485" width="1030" height="66" rx="18" fill="#e7f4ee"/><text x="57" y="526" class="label">Same chromosome number and genetic information — not half the number.</text></svg>