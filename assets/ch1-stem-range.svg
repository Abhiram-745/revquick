<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590" role="img" aria-labelledby="title desc"><title id="title">Stem-cell sources: compare the range</title><desc id="desc">Embryonic stem cells form most human cell types; adult bone-marrow stem cells form a limited range including blood cells; plant meristem cells can differentiate into any plant cell type throughout life.</desc><rect width="1100" height="590" fill="white"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#17273a}.heading{font-size:32px;font-weight:700}.label{font-size:24px;font-weight:700}.note{font-size:21px}.small{font-size:18px;fill:#526477}.arrow{stroke:#227669;stroke-width:3;fill:none}.outline{stroke:#17273a;stroke-width:2.5;fill:none}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#227669"/></marker></defs><text x="35" y="48" class="heading">Stem-cell sources: compare the range</text><text x="35" y="88" class="note">Differentiate = become specialised. Stem cells can also divide to make more stem cells.</text><rect x="35" y="125" width="310" height="365" rx="18" fill="#e7f4ee"/><text x="190" y="166" class="label" text-anchor="middle">Embryonic</text><rect x="395" y="125" width="310" height="365" rx="18" fill="#e6f1ff"/><text x="550" y="166" class="label" text-anchor="middle">Adult bone marrow</text><rect x="755" y="125" width="310" height="365" rx="18" fill="#f2eafb"/><text x="910" y="166" class="label" text-anchor="middle">Plant meristem</text><circle cx="153" cy="233" r="22" fill="white" stroke="#17273a" stroke-width="2.5"/><circle cx="153" cy="233" r="7" fill="#a581d5" stroke="#a581d5" stroke-width="2.5"/><circle cx="191" cy="233" r="22" fill="white" stroke="#17273a" stroke-width="2.5"/><circle cx="191" cy="233" r="7" fill="#a581d5" stroke="#a581d5" stroke-width="2.5"/><circle cx="172" cy="268" r="22" fill="white" stroke="#17273a" stroke-width="2.5"/><circle cx="172" cy="268" r="7" fill="#a581d5" stroke="#a581d5" stroke-width="2.5"/><circle cx="134" cy="267" r="22" fill="white" stroke="#17273a" stroke-width="2.5"/><circle cx="134" cy="267" r="7" fill="#a581d5" stroke="#a581d5" stroke-width="2.5"/><circle cx="209" cy="267" r="22" fill="white" stroke="#17273a" stroke-width="2.5"/><circle cx="209" cy="267" r="7" fill="#a581d5" stroke="#a581d5" stroke-width="2.5"/><text x="190" y="324" class="note" text-anchor="middle">Human embryo</text><path d="M190 337 L190 370" class="arrow" marker-end="url(#arrow)"/><text x="190" y="404" class="note" text-anchor="middle">Most human cell types</text><text x="190" y="451" class="small" text-anchor="middle">e.g. nerve and muscle cells</text><path d="M480 210 Q466 192 478 181 Q489 173 503 190 L548 240 Q566 239 574 253 Q581 269 566 279 Q553 285 543 266 L494 218 Q482 226 476 219 Z" fill="#f6c4cb" stroke="#17273a" stroke-width="2.5"/><text x="550" y="324" class="note" text-anchor="middle">Bone marrow</text><path d="M550 337 L550 370" class="arrow" marker-end="url(#arrow)"/><text x="550" y="404" class="note" text-anchor="middle">Limited range of cells</text><text x="550" y="451" class="small" text-anchor="middle">Including blood cells</text><g transform="translate(910 253) scale(0.73)"><path d="M0 42 V-65" stroke="#227669" stroke-width="5" fill="none"/><path d="M0 -27 Q-48 -66 -45 -26 Q-20 -7 0 -27 M0 -48 Q48 -90 45 -46 Q22 -21 0 -48" fill="#bee2c6" stroke="#227669" stroke-width="2.5"/><path d="M0 42 L-12 73 M0 42 L15 77 M0 42 V87" stroke="#a98a65" stroke-width="3" fill="none"/></g><circle cx="910" cy="205" r="9" fill="#fff2b9" stroke="#17273a" stroke-width="2.5"/><text x="910" y="324" class="note" text-anchor="middle">Growing tips</text><path d="M910 337 L910 370" class="arrow" marker-end="url(#arrow)"/><text x="910" y="404" class="note" text-anchor="middle">Any type of plant cell</text><text x="910" y="451" class="small" text-anchor="middle">Throughout the plant’s life</text><text x="35" y="543" class="note">Exam comparison: embryonic stem cells can form more types than adult bone-marrow stem cells.</text></svg>