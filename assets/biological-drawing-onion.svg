<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
<title id="title">Onion bulb epidermal cells</title><desc id="desc">Six elongated cells with adjoining walls in staggered rows, small nuclei and straight labels for cell wall and nucleus. Original illustrative drawing informed by microscopy references, not a measured specimen.</desc>
<rect width="1000" height="600" fill="white"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#17273a}.title{font-size:32px;font-weight:700}.label{font-size:27px}.note{font-size:22px;fill:#526477}.outline{fill:none;stroke:#25323b;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.wall{fill:none;stroke:#25323b;stroke-width:3.2;stroke-linejoin:round;stroke-linecap:round}.leader{fill:none;stroke:#25323b;stroke-width:1.8}</style>
<text x="36" y="48" class="title">Onion bulb epidermal cells</text>
<text x="36" y="82" class="note">Biological drawing · clear outlines, no shading</text>
