<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650"><rect width="1100" height="650" rx="24" fill="#fff"/><g font-family="Arial,sans-serif" fill="#183544"><text x="48" y="58" font-size="30" font-weight="700">Pregnancy test: read the control line first</text><text x="48" y="93" font-size="20">T = test line · C = control line · conventional two-line model</text><rect x="40" y="125" width="325" height="415" rx="18" fill="#e0f7ee"/><text x="64" y="174" font-size="28" font-weight="700">Positive</text><rect x="100" y="202" width="185" height="260" rx="22" fill="white" stroke="#254a62" stroke-width="3"/><rect x="125" y="235" width="94" height="180" rx="8" fill="#f6f7fa" stroke="#ccd5dd"/><text x="237" y="289" font-size="23" font-weight="700">C</text><rect x="138" y="274" width="68" height="14" rx="3" fill="#cc3c91"/><text x="237" y="372" font-size="23" font-weight="700">T</text><rect x="138" y="357" width="68" height="14" rx="3" fill="#cc3c91"/><text x="64" y="505" font-size="20" font-weight="700">hCG detected</text><rect x="395" y="125" width="325" height="415" rx="18" fill="#e6f2ff"/><text x="419" y="174" font-size="28" font-weight="700">Negative</text><rect x="455" y="202" width="185" height="260" rx="22" fill="white" stroke="#254a62" stroke-width="3"/><rect x="480" y="235" width="94" height="180" rx="8" fill="#f6f7fa" stroke="#ccd5dd"/><text x="592" y="289" font-size="23" font-weight="700">C</text><rect x="493" y="274" width="68" height="14" rx="3" fill="#cc3c91"/><text x="592" y="372" font-size="23" font-weight="700">T</text><text x="419" y="505" font-size="20" font-weight="700">hCG not detected</text><rect x="750" y="125" width="325" height="415" rx="18" fill="#fff0e3"/><text x="774" y="174" font-size="28" font-weight="700">Invalid</text><rect x="810" y="202" width="185" height="260" rx="22" fill="white" stroke="#254a62" stroke-width="3"/><rect x="835" y="235" width="94" height="180" rx="8" fill="#f6f7fa" stroke="#ccd5dd"/><text x="947" y="289" font-size="23" font-weight="700">C</text><text x="947" y="372" font-size="23" font-weight="700">T</text><rect x="848" y="357" width="68" height="14" rx="3" fill="#cc3c91"/><text x="774" y="505" font-size="20" font-weight="700">No control → repeat test</text><text x="48" y="585" font-size="23" font-weight="700">No C line = invalid, even if a T line appears.</text><text x="48" y="622" font-size="20">Use the design and instructions supplied in the exam question.</text></g></svg>