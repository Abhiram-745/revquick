<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590" role="img" aria-labelledby="title desc"><title id="title">Therapeutic cloning: why matching genes matters</title><desc id="desc">Conceptual pathway from patient-matched embryo to stem cells and specialised replacement cells. In the AQA model matching genes prevents rejection. Diabetes and paralysis are potential uses; viral infection and embryo-related ethical objections are evaluation points.</desc><rect width="1100" height="590" fill="white"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#17273a}.heading{font-size:32px;font-weight:700}.label{font-size:24px;font-weight:700}.note{font-size:21px}.small{font-size:18px;fill:#526477}.arrow{stroke:#227669;stroke-width:3;fill:none}.outline{stroke:#17273a;stroke-width:2.5;fill:none}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#227669"/></marker></defs><text x="35" y="48" class="heading">Therapeutic cloning: why matching genes matters</text><text x="35" y="87" class="note">AQA concept: patient-matched genes → replacement cells are not rejected.</text><rect x="35" y="128" width="245" height="318" rx="18" fill="#e7f4ee"/><rect x="315" y="128" width="235" height="318" rx="18" fill="#e6f1ff"/><rect x="585" y="128" width="230" height="318" rx="18" fill="#f2eafb"/><rect x="850" y="128" width="215" height="318" rx="18" fill="#fce7ed"/><text x="158" y="171" class="label" text-anchor="middle">Patient</text><circle cx="158" cy="234" r="25" fill="white" stroke="#17273a" stroke-width="2.5"/><path d="M115 327 V296 Q115 266 158 266 Q201 266 201 296 V327 Z" fill="#bee2c6" stroke="#17273a" stroke-width="2.5"/><text x="158" y="397" class="note" text-anchor="middle">Genes matched</text><text x="433" y="169" class="label" text-anchor="middle">Matched embryo</text><circle cx="414" cy="238" r="20" fill="white" stroke="#17273a" stroke-width="2.5"/><circle cx="414" cy="238" r="6" fill="#a581d5" stroke="#a581d5" stroke-width="2.5"/><circle cx="450" cy="239" r="20" fill="white" stroke="#17273a" stroke-width="2.5"/><circle cx="450" cy="239" r="6" fill="#a581d5" stroke="#a581d5" stroke-width="2.5"/><circle cx="433" cy="269" r="20" fill="white" stroke="#17273a" stroke-width="2.5"/><circle cx="433" cy="269" r="6" fill="#a581d5" stroke="#a581d5" stroke-width="2.5"/><circle cx="397" cy="270" r="20" fill="white" stroke="#17273a" stroke-width="2.5"/><circle cx="397" cy="270" r="6" fill="#a581d5" stroke="#a581d5" stroke-width="2.5"/><circle cx="468" cy="268" r="20" fill="white" stroke="#17273a" stroke-width="2.5"/><circle cx="468" cy="268" r="6" fill="#a581d5" stroke="#a581d5" stroke-width="2.5"/><text x="433" y="362" class="note" text-anchor="middle">Same genes as</text><text x="433" y="395" class="note" text-anchor="middle">the patient</text><text x="700" y="169" class="label" text-anchor="middle">Stem cells</text><circle cx="678" cy="245" r="26" fill="white" stroke="#17273a" stroke-width="2.5"/><circle cx="725" cy="278" r="26" fill="white" stroke="#17273a" stroke-width="2.5"/><circle cx="678" cy="245" r="8" fill="#a581d5" stroke="#a581d5" stroke-width="2.5"/><circle cx="725" cy="278" r="8" fill="#a581d5" stroke="#a581d5" stroke-width="2.5"/><text x="700" y="362" class="note" text-anchor="middle">Divide, then</text><text x="700" y="395" class="note" text-anchor="middle">differentiate</text><text x="957" y="169" class="note" text-anchor="middle">Replacement cells</text><circle cx="927" cy="239" r="20" fill="#e6f1ff" stroke="#17273a" stroke-width="2.5"/><circle cx="927" cy="239" r="6" fill="#a581d5" stroke="#a581d5" stroke-width="2.5"/><circle cx="969" cy="252" r="20" fill="#e6f1ff" stroke="#17273a" stroke-width="2.5"/><circle cx="969" cy="252" r="6" fill="#a581d5" stroke="#a581d5" stroke-width="2.5"/><circle cx="943" cy="292" r="20" fill="#e6f1ff" stroke="#17273a" stroke-width="2.5"/><circle cx="943" cy="292" r="6" fill="#a581d5" stroke="#a581d5" stroke-width="2.5"/><text x="957" y="362" class="small" text-anchor="middle">Used for potential</text><text x="957" y="395" class="small" text-anchor="middle">medical treatment</text><path d="M280 285 L314 285" class="arrow" marker-end="url(#arrow)"/><path d="M550 285 L584 285" class="arrow" marker-end="url(#arrow)"/><path d="M815 285 L849 285" class="arrow" marker-end="url(#arrow)"/><rect x="35" y="472" width="1030" height="77" rx="18" fill="#fff2b9"/><text x="56" y="505" class="label">Potential uses: diabetes and paralysis.</text><text x="56" y="536" class="note">Evaluate viral-infection risk and ethical or religious objections to using embryos.</text></svg>